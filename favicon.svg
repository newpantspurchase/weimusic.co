<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Simple text-mark favicon: "WEI" on the same dark background as
       the site's default (dark) theme. Google Fonts aren't loaded in
       a favicon's rendering context, so this falls back to a plain
       bold system sans-serif rather than referencing Space Grotesk
       directly - it won't be pixel-identical to the site's headings,
       but reads clearly even at 16x16 in a browser tab. -->
  <rect width="100" height="100" rx="20" fill="#14161c"/>
  <text
    x="50"
    y="65"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="30"
    fill="#ede8dd"
    text-anchor="middle">WEI</text>
</svg>
